<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Solvisning</title>

  <style>
    /* Nollställ marginaler och låt sidan fylla hela skärmen.
       height: 100% på html och body behövs för att video-elementet
       ska kunna bli 100% högt längre ner. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      /* Hindra att sidan går att dra/zooma som en vanlig webbsida.
         Det ska kännas som en app, inte ett dokument. */
      overscroll-behavior: none;
      font-family: -apple-system, system-ui, sans-serif;
    }

    /* Wrappen är hela skärmen. position: fixed gör att den ligger
       stilla även om något råkar bli för stort. */
    #scen {
      position: fixed;
      inset: 0;                /* kortform för top/right/bottom/left: 0 */
      overflow: hidden;
    }

    /* Videon fyller hela scenen. object-fit: cover betyder att bilden
       beskärs så att den täcker ytan utan svarta kanter, precis som
       en kameraapp. */
    #kamera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Canvasen ligger exakt ovanpå videon och är dold tills vi fryser
       en bild. Samma object-fit: cover så att den frysta bilden hamnar
       likadant som live-bilden gjorde. */
    #foto {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #foto[hidden] {
      display: none;
    }

    /* Knappen ligger ovanpå videon, centrerad en bit upp från nederkanten.
       env(safe-area-inset-bottom) håller den ovanför iPhones hemknappstreck. */
    #ta-bild {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(32px + env(safe-area-inset-bottom));

      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.25);
      cursor: pointer;
    }

    #ta-bild:active {
      background: rgba(255, 255, 255, 0.5);
    }

    /* Ruta för felmeddelanden. Ligger som ett svart lager över allt.
       display: flex behövs för att centrera texten, men en id-regel
       väger tyngre än webbläsarens [hidden]-regel, så vi måste själva
       säga åt rutan att försvinna när hidden-attributet är satt. */
    #fel {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
      background: #000;
      text-align: center;
      line-height: 1.5;
    }

    #fel[hidden] {
      display: none;
    }

    /* Liten statusrad högst upp. Visar vad appen gör just nu medan
       kameran startar, försvinner när bilden är igång. */
    #status {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 13px;
    }

    /* Panel nedtill som visas när en bild är fryst. Håller avläsningen
       och de två reglagen. Ligger ovanför knappen. */
    #panel {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(120px + env(safe-area-inset-bottom));
      width: min(92vw, 420px);
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.62);
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }

    #panel[hidden] {
      display: none;
    }

    /* white-space: pre-line gör att \n i texten faktiskt bryter rad. */
    #avlasning {
      text-align: center;
      line-height: 1.4;
      white-space: pre-line;
      margin-bottom: 10px;
    }

    /* Ett reglage med sin etikett. */
    .reglage {
      display: block;
      margin-top: 8px;
    }

    .reglage .etikett {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 2px;
    }

    /* Bredare reglage med större greppyta för fingret. */
    .reglage input[type="range"] {
      width: 100%;
      margin: 0;
      accent-color: #ffb300;
      height: 28px;
    }

    #sol-text {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      line-height: 1.4;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <div id="scen">
    <!-- playsinline krävs på iOS, annars försöker Safari spela videon
         i helskärm med egna kontroller. muted behövs för att webbläsaren
         ska låta oss starta videon utan ett knapptryck. -->
    <video id="kamera" playsinline muted></video>
    <!-- Den frysta bilden ritas hit. Ligger i samma wrapp som videon. -->
    <canvas id="foto" hidden></canvas>
  </div>

  <!-- Knappen finns men gör inget än. aria-label ger den ett namn för
       skärmläsare eftersom den inte har någon text. -->
  <button id="ta-bild" type="button" aria-label="Ta bild"></button>

  <div id="status">Startar kameran…</div>

  <!-- Panelen med avläsning och reglage. Visas bara när en bild är fryst. -->
  <div id="panel" hidden>
    <div id="avlasning"></div>

    <label class="reglage">
      <span class="etikett"><span>Datum</span><span id="datum-text"></span></span>
      <!-- 0 till 364 = dag på året. Steg 1 = en dag i taget. -->
      <input type="range" id="datum" min="0" max="364" step="1" value="0">
    </label>

    <label class="reglage">
      <span class="etikett"><span>Tid</span><span id="tid-text"></span></span>
      <!-- 0 till 1439 = minuter efter midnatt. I steg 4 snävas det in
           till soluppgång–solnedgång. -->
      <input type="range" id="tid" min="0" max="1439" step="5" value="720">
    </label>

    <!-- Solens läge för valt datum och tid. Uppdateras när du drar. -->
    <div id="sol-text"></div>
  </div>

  <div id="fel" hidden></div>

  <!-- SunCalc, av Vladimir Agafonkin, BSD 2-Clause. Inlagd rakt i filen
       så att appen är en enda fil och funkar utan nät. Bara sol-delarna,
       måne borttagen. Källa: github.com/mourner/suncalc -->
  <script>
  (function () {
    'use strict';
    var PI = Math.PI, sin = Math.sin, cos = Math.cos, tan = Math.tan,
        asin = Math.asin, atan = Math.atan2, acos = Math.acos, rad = PI / 180;
    var dayMs = 1000 * 60 * 60 * 24, J1970 = 2440588, J2000 = 2451545;

    function toJulian(date) { return date.valueOf() / dayMs - 0.5 + J1970; }
    function fromJulian(j) { return new Date((j + 0.5 - J1970) * dayMs); }
    function toDays(date) { return toJulian(date) - J2000; }

    var e = rad * 23.4397; // jordaxelns lutning

    function rightAscension(l, b) { return atan(sin(l) * cos(e) - tan(b) * sin(e), cos(l)); }
    function declination(l, b) { return asin(sin(b) * cos(e) + cos(b) * sin(e) * sin(l)); }
    function azimuth(H, phi, dec) { return atan(sin(H), cos(H) * sin(phi) - tan(dec) * cos(phi)); }
    function altitude(H, phi, dec) { return asin(sin(phi) * sin(dec) + cos(phi) * cos(dec) * cos(H)); }
    function siderealTime(d, lw) { return rad * (280.16 + 360.9856235 * d) - lw; }

    function solarMeanAnomaly(d) { return rad * (357.5291 + 0.98560028 * d); }
    function eclipticLongitude(M) {
      var C = rad * (1.9148 * sin(M) + 0.02 * sin(2 * M) + 0.0003 * sin(3 * M)),
          P = rad * 102.9372;
      return M + C + P + PI;
    }
    function sunCoords(d) {
      var M = solarMeanAnomaly(d), L = eclipticLongitude(M);
      return { dec: declination(L, 0), ra: rightAscension(L, 0) };
    }

    var SunCalc = {};

    SunCalc.getPosition = function (date, lat, lng) {
      var lw = rad * -lng, phi = rad * lat, d = toDays(date),
          c = sunCoords(d), H = siderealTime(d, lw) - c.ra;
      return { azimuth: azimuth(H, phi, c.dec), altitude: altitude(H, phi, c.dec) };
    };

    var times = [[-0.833, 'sunrise', 'sunset']];
    var J0 = 0.0009;

    function julianCycle(d, lw) { return Math.round(d - J0 - lw / (2 * PI)); }
    function approxTransit(Ht, lw, n) { return J0 + (Ht + lw) / (2 * PI) + n; }
    function solarTransitJ(ds, M, L) { return J2000 + ds + 0.0053 * sin(M) - 0.0069 * sin(2 * L); }
    function hourAngle(h, phi, d) { return acos((sin(h) - sin(phi) * sin(d)) / (cos(phi) * cos(d))); }
    function getSetJ(h, lw, phi, dec, n, M, L) {
      var w = hourAngle(h, phi, dec), a = approxTransit(w, lw, n);
      return solarTransitJ(a, M, L);
    }

    SunCalc.getTimes = function (date, lat, lng) {
      var lw = rad * -lng, phi = rad * lat, d = toDays(date),
          n = julianCycle(d, lw), ds = approxTransit(0, lw, n),
          M = solarMeanAnomaly(ds), L = eclipticLongitude(M),
          dec = declination(L, 0), Jnoon = solarTransitJ(ds, M, L),
          i, len, time, h0, Jset, Jrise;

      var result = { solarNoon: fromJulian(Jnoon), nadir: fromJulian(Jnoon - 0.5) };

      for (i = 0, len = times.length; i < len; i += 1) {
        time = times[i];
        h0 = time[0] * rad;
        Jset = getSetJ(h0, lw, phi, dec, n, M, L);
        Jrise = Jnoon - (Jset - Jnoon);
        result[time[1]] = fromJulian(Jrise);
        result[time[2]] = fromJulian(Jset);
      }
      return result;
    };

    window.SunCalc = SunCalc;
  })();
  </script>

  <script>
    // Hämta referenser till elementen vi ska jobba med.
    const video = document.getElementById('kamera');
    const felruta = document.getElementById('fel');
    const statusrad = document.getElementById('status');

    // Skriv en rad både på skärmen och i konsolen, så att vi kan följa
    // förloppet. Öppna webbläsarens konsol med Cmd+Alt+I om något strular.
    function status(text) {
      statusrad.textContent = text;
      console.log('[solvisning]', text);
    }

    // Visa ett felmeddelande i stället för kamerabilden.
    function visaFel(text) {
      statusrad.hidden = true;
      felruta.textContent = text;
      felruta.hidden = false;
      console.error('[solvisning]', text);
    }

    async function startaKamera() {
      // getUserMedia finns bara i säkra sammanhang: https eller localhost.
      // Öppnar du filen direkt från skrivbordet (file://) saknas det helt.
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        visaFel('Kameran kräver att sidan körs över https eller på localhost.');
        return;
      }

      let strom;
      try {
        status('Frågar efter kamera…');
        // Be webbläsaren om en videoström.
        // facingMode: 'environment' = baksideskameran på en mobil.
        // 'ideal' betyder önskemål, inte krav, så det funkar även på en
        // dator som bara har frontkamera.
        strom = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
      } catch (err) {
        // Vanligaste felen: användaren nekade behörighet, eller ingen
        // kamera hittades. err.name säger vilket.
        visaFel('Kunde inte hämta kameran: ' + err.name + ' – ' + err.message);
        return;
      }

      // Koppla strömmen till video-elementet.
      video.srcObject = strom;

      // Diagnostik: vilket kameraspår fick vi, och levererar det bilder?
      // getVideoTracks() ger en lista, vi tar det första spåret.
      const spar = strom.getVideoTracks()[0];
      console.log('[solvisning] spår:', spar && spar.label);
      console.log('[solvisning] readyState:', spar && spar.readyState);
      // track.muted = true betyder att källan inte skickar några bildrutor,
      // oftast för att en annan app har lagt beslag på kameran.
      console.log('[solvisning] spår muted:', spar && spar.muted);
      console.log('[solvisning] inställningar:', spar && JSON.stringify(spar.getSettings()));

      // Logga om spåret blir muted/unmuted medan appen är igång.
      // Bara till konsolen, så det inte skriver över annan statustext.
      if (spar) {
        spar.addEventListener('mute', () => console.log('[solvisning] spår muted'));
        spar.addEventListener('unmute', () => console.log('[solvisning] spår unmuted'));
      }

      // När videon fått sin första bildruta vet vi den faktiska storleken.
      video.addEventListener('loadedmetadata', () => {
        console.log('[solvisning] videostorlek:', video.videoWidth, 'x', video.videoHeight);
      });

      // srcObject räcker inte alltid för att bilden ska börja spela.
      // Vissa webbläsare struntar i autoplay här, så vi startar själva.
      // play() ger ett löfte som avvisas om webbläsaren blockerar det.
      try {
        status('Startar uppspelning…');
        await video.play();
        // Vänta en kort stund och kontrollera att det faktiskt kommer bilder.
        setTimeout(() => {
          if (video.videoWidth === 0) {
            status('Ansluten, men får ingen bild. Stäng andra appar som använder kameran.');
          } else if (spar && spar.muted) {
            status('Kameran är upptagen av en annan app.');
          } else {
            status('Kameran igång: ' + video.videoWidth + '×' + video.videoHeight);
            setTimeout(() => { statusrad.hidden = true; }, 1500);
          }
        }, 600);
      } catch (err) {
        // Om webbläsaren vägrar autostarta: låt användaren trycka på skärmen.
        status('Tryck på skärmen för att starta bilden');
        document.body.addEventListener('click', async () => {
          try {
            await video.play();
            statusrad.hidden = true;
          } catch (e) {
            visaFel('Uppspelningen blockeras: ' + e.message);
          }
        }, { once: true });
      }
    }

    startaKamera();


    // --- 2a: frysa bilden ---

    const knapp = document.getElementById('ta-bild');
    const canvas = document.getElementById('foto');
    const panel = document.getElementById('panel');
    const avlasning = document.getElementById('avlasning');
    const datumReglage = document.getElementById('datum');
    const tidReglage = document.getElementById('tid');
    const datumText = document.getElementById('datum-text');
    const tidText = document.getElementById('tid-text');
    const solText = document.getElementById('sol-text');
    // getContext('2d') ger oss ett ritobjekt. Allt vi ritar på canvasen
    // går genom det.
    const rityta = canvas.getContext('2d');

    // Håller reda på om vi visar en fryst bild eller live-video just nu.
    let fryst = false;

    // Här sparas den senast frysta bilden med sina avlästa värden.
    // För tillfället använder vi bara det till att visa text, men i
    // senare steg är det här solberäkningen utgår från.
    let bild = null;


    // --- 2b: läsa kompass och lutning ---

    // orientering uppdateras hela tiden så länge sensorn är igång.
    // Vi läser av den i frysögonblicket, inte senare.
    let orientering = null;
    let sensorerStartade = false;

    // Ett orienteringsevent kommer flera gånger i sekunden. Vi plockar ut
    // det vi behöver och sparar i orientering.
    function taEmotOrientering(e) {
      // webkitCompassHeading finns bara på iOS. 0 = norr, medurs.
      // På Android får vi i stället alpha, som räknas moturs från norr,
      // så vi vänder på den med 360 - alpha.
      let riktning = null;
      if (typeof e.webkitCompassHeading === 'number') {
        riktning = e.webkitCompassHeading;
      } else if (e.absolute === true && typeof e.alpha === 'number') {
        riktning = (360 - e.alpha) % 360;
      }

      orientering = {
        riktning: riktning,                    // grader, dit kameran pekar
        // webkitCompassAccuracy: ungefärligt fel i grader på iOS.
        // Högt värde eller -1 betyder att kompassen inte litar på sig själv.
        noggrannhet: (typeof e.webkitCompassAccuracy === 'number')
          ? e.webkitCompassAccuracy : null,
        beta: e.beta,     // lutning framåt/bakåt, 90 = telefonen upprätt
        gamma: e.gamma,   // lutning i sidled
        tidpunkt: new Date()
      };
    }

    async function startaSensorer() {
      // På iOS 13+ måste vi be om lov, och anropet måste ske från ett
      // knapptryck. Därför ligger det här och inte i sidladdningen.
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const svar = await DeviceOrientationEvent.requestPermission();
          if (svar !== 'granted') {
            status('Rörelsesensorn nekades. Kompassen är avstängd.');
            return false;
          }
        } catch (err) {
          status('Kunde inte fråga om rörelsesensorn: ' + err.message);
          return false;
        }
      }

      // Android skickar absolut väderstreck via ett eget event.
      window.addEventListener('deviceorientationabsolute', taEmotOrientering);
      // iOS och övriga via det vanliga eventet.
      window.addEventListener('deviceorientation', taEmotOrientering);
      return true;
    }

    // Gör en läsbar text av ett orienteringsvärde.
    function beskrivOrientering(o) {
      if (!o || o.riktning === null) {
        return 'Ingen kompassdata.\nHåll telefonen stilla en stund och ta om.';
      }

      // % 360 så att 360 blir 0.
      const rikt = Math.round(o.riktning) % 360;
      let rad1 = 'Riktning: ' + rikt + '°';
      if (o.noggrannhet !== null) {
        rad1 += ' (±' + Math.round(o.noggrannhet) + '°)';
      }

      // beta 90 = upprätt telefon. Avvikelsen därifrån är hur mycket
      // kameran pekar upp eller ner.
      let rad2 = 'Lutning: okänd';
      if (typeof o.beta === 'number') {
        const upp = Math.round(o.beta - 90);
        if (upp === 0) {
          rad2 = 'Lutning: vågrätt';
        } else {
          rad2 = 'Lutning: ' + Math.abs(upp) + '° ' + (upp > 0 ? 'upp' : 'ner');
        }
      }

      // Varna när kompassen är osäker. Briefen kräver att osäkerheten syns.
      let rad3 = '';
      if (o.noggrannhet === null || o.noggrannhet < 0 || o.noggrannhet > 20) {
        rad3 = '\nKompassen är osäker här. Räkna med en halvtimmes fel i soltid.';
      }

      return rad1 + '\n' + rad2 + rad3;
    }


    // --- 3: reglage för datum och tid ---

    // Vilket år vi räknar i. Skottår hanteras genom att max på reglaget
    // är 364, alltså 365 dagar, och 29 februari faller bort de flesta år.
    const arNu = new Date().getFullYear();

    // valtDatum och valdTid är det användaren har ställt in just nu.
    // I steg 4 är det de här värdena solberäkningen matas med.
    let valtDatum = new Date();
    let valdTid = 720;
    let reglageInit = false;

    // Dagnummer 0–364 till ett riktigt datum.
    function dagTillDatum(dag) {
      // new Date(år, 0, 1) är 1 januari. + dag ger rätt dygn.
      return new Date(arNu, 0, 1 + dag);
    }

    // Datum till svensk text, t.ex. "14 februari".
    function formateraDatum(d) {
      return d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'long' });
    }

    // Minuter efter midnatt till "13:05".
    function formateraTid(minuter) {
      const h = Math.floor(minuter / 60);
      const m = minuter % 60;
      // padStart(2, '0') lägger på en nolla så att 5 blir "05".
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    }

    // Bygger ett Date för valt datum och valt klockslag i lokal tid.
    function valdTidpunkt() {
      const d = new Date(valtDatum);
      d.setHours(Math.floor(valdTid / 60), valdTid % 60, 0, 0);
      return d;
    }

    // Läser av båda reglagen, uppdaterar texten och räknar om solen.
    function lasAvReglage() {
      valtDatum = dagTillDatum(Number(datumReglage.value));
      valdTid = Number(tidReglage.value);
      // När datumet ändras flyttar sig soluppgång och solnedgång, så
      // reglagets gränser måste räknas om innan vi läser klockslaget.
      uppdateraSoltider();
      valdTid = Number(tidReglage.value);
      datumText.textContent = formateraDatum(valtDatum);
      tidText.textContent = formateraTid(valdTid);
      uppdateraSol();
    }

    // Ställ reglagen på dagens datum och nuvarande tid första gången.
    function initReglage() {
      const idag = new Date();
      // Millisekunder sedan årsskiftet delat med ett dygn = dagnummer.
      const dagnummer = Math.floor((idag - new Date(arNu, 0, 1)) / 86400000);
      datumReglage.value = dagnummer;
      valtDatum = dagTillDatum(dagnummer);
      uppdateraSoltider();
      tidReglage.value = idag.getHours() * 60 + idag.getMinutes();
      lasAvReglage();
      reglageInit = true;
    }

    // input-eventet kommer för varje litet ryck i reglaget medan fingret drar.
    datumReglage.addEventListener('input', lasAvReglage);
    tidReglage.addEventListener('input', lasAvReglage);


    // --- 4a: position och solens läge ---

    // position sätts när geolokaliseringen svarat. { lat, lng }.
    let position = null;
    let positionBegard = false;

    // Startar positionshämtningen. Vi väntar inte in den, utan låter
    // panelen uppdatera sig när svaret kommer. Måste anropas direkt från
    // knapptrycket, annars visar iOS ingen lov-ruta.
    function begarPosition() {
      if (positionBegard) return;
      positionBegard = true;

      if (!navigator.geolocation) {
        status('Ingen geolokalisering i den här webbläsaren.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (p) => {
          position = { lat: p.coords.latitude, lng: p.coords.longitude };
          console.log('[solvisning] position:', position);
          // Nu finns position, räkna om panelen om den redan visas.
          if (reglageInit) lasAvReglage();
        },
        (err) => {
          // Låt användaren prova igen genom att nolla flaggan.
          positionBegard = false;
          solText.textContent = 'Ingen position: ' + err.message;
          console.warn('[solvisning] position-fel:', err);
        },
        // 15 sekunder för en kall bestämning. Grov noggrannhet räcker för
        // solberäkning, och en position upp till fem minuter gammal duger.
        { timeout: 15000, maximumAge: 300000, enableHighAccuracy: false }
      );
    }

    // Snävar tidsreglaget till soluppgång–solnedgång för valt datum.
    // Utan position lämnar vi det på hela dygnet.
    function uppdateraSoltider() {
      if (!position) {
        tidReglage.min = 0;
        tidReglage.max = 1439;
        return;
      }

      const t = SunCalc.getTimes(valdTidpunkt(), position.lat, position.lng);
      const upp = t.sunrise, ned = t.sunset;

      // Vid midnattssol eller polarnatt blir tiderna ogiltiga (NaN).
      if (isNaN(upp) || isNaN(ned)) {
        tidReglage.min = 0;
        tidReglage.max = 1439;
        return;
      }

      const minuterAv = (d) => d.getHours() * 60 + d.getMinutes();
      tidReglage.min = minuterAv(upp);
      tidReglage.max = minuterAv(ned);

      // Klämma in nuvarande värde inom de nya gränserna.
      const v = Number(tidReglage.value);
      if (v < tidReglage.min) tidReglage.value = tidReglage.min;
      if (v > tidReglage.max) tidReglage.value = tidReglage.max;
    }

    // Väderstreck som bokstäver, för läsbarheten.
    function vaderstreck(grader) {
      const namn = ['norr', 'nordost', 'öster', 'sydost',
                    'söder', 'sydväst', 'väster', 'nordväst'];
      // Dela cirkeln i åtta, avrunda till närmaste.
      return namn[Math.round(grader / 45) % 8];
    }

    // Räknar ut solens läge för vald tidpunkt och skriver texten.
    // Sparas också i sol-variabeln som steg 4b ritar utifrån.
    let sol = null;

    function uppdateraSol() {
      if (!position) {
        solText.textContent = 'Väntar på position…';
        sol = null;
        return;
      }

      const p = SunCalc.getPosition(valdTidpunkt(), position.lat, position.lng);
      // SunCalc ger radianer. azimut räknas från söder, medurs mot väster.
      // Vi vill ha kompassgrader från norr, så vi lägger på 180.
      const azimut = (p.azimuth * 180 / Math.PI + 180 + 360) % 360;
      const hojd = p.altitude * 180 / Math.PI;

      sol = { azimut: azimut, hojd: hojd };

      if (hojd < 0) {
        solText.textContent = 'Solen är under horisonten då.\n'
          + 'Azimut ' + Math.round(azimut) + '°, ' + Math.round(hojd) + '°';
        return;
      }

      solText.textContent =
        'Solen: ' + Math.round(azimut) + '° i ' + vaderstreck(azimut) + '\n'
        + Math.round(hojd) + '° över horisonten';
    }


    function frysBild() {
      // Ingen bild att frysa om videon inte har någon storlek än.
      if (video.videoWidth === 0) return;

      // Sätt canvasens interna pixelstorlek till videons faktiska
      // upplösning. Det här är canvasens "riktiga" storlek, skild från
      // hur stor den visas på skärmen (det styr CSS).
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      // Rita videons nuvarande bildruta till canvasen, från hörn till hörn.
      // I samma ögonblick som den här raden körs fryses bilden.
      rityta.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Läs av orienteringen i exakt det här ögonblicket och spara den
      // tillsammans med bilden. Det är den kritiska detaljen: riktningen
      // ska höra ihop med just den här bildrutan.
      bild = {
        canvas: canvas,
        orientering: orientering,
        tagen: new Date()
      };

      // Visa canvasen ovanpå videon.
      canvas.hidden = false;
      fryst = true;

      // Visa avläsningen och reglagen.
      avlasning.textContent = beskrivOrientering(orientering);
      if (!reglageInit) initReglage();
      panel.hidden = false;

      status('Bild fryst. Tryck på bilden för att ta om.');
      statusrad.hidden = false;
    }

    function atergaTillLive() {
      canvas.hidden = true;
      panel.hidden = true;
      fryst = false;
      statusrad.hidden = true;
    }

    // Knappen: frys om vi är live, gå tillbaka om vi redan är frysta.
    knapp.addEventListener('click', async () => {
      if (fryst) {
        atergaTillLive();
        return;
      }

      // Be om position direkt, medan knapptrycket fortfarande "räknas".
      // Den fylls i när svaret kommer, vi väntar inte in den.
      begarPosition();

      // Starta rörelsesensorn. Här väntar vi in lov-rutan, men bara den.
      if (!sensorerStartade) {
        sensorerStartade = await startaSensorer();
      }

      frysBild();
    });

    // Tryck på den frysta bilden för att gå tillbaka till live.
    canvas.addEventListener('click', atergaTillLive);
  </script>
</body>
</html>
